# Obelisk: SanDisk HBF Gen1 baseline.
# Parameters: SanDisk fact sheet 2025 (512 GB/stack, 16-Hi BiCS NAND, 1.6 TB/s).

[simulation]
max_cycles              = 100_000_000
warmup_cycles           = 0
freq_mhz                = 1000
output_csv_path         = "output/hbf_gen1.csv"
output_stats_json_path  = "output/hbf_gen1_stats.json"
log_level               = 1

[requester]
trace_file              = "traces/samples/synthetic_seq.trace"
max_in_flight           = 128
issue_rate_per_cyc      = 2

[host_bus]
bandwidth_gbps          = 128.0
base_latency_cycles     = 50
queue_depth             = 64
cpu_compute_cycles      = 100

[address_mapping]
policy                  = "channel_interleave_first"
num_stacks              = 1
num_channels            = 8
num_dies_hbf            = 16       # CONFIRMED: SanDisk fact sheet
num_subarrays_hbf       = 32       # ESTIMATED: "parallel sub-array" wording
page_size_bytes         = 16384    # ESTIMATED: BiCS typical
hbm_base_addr           = "0x0"
hbm_size_bytes          = "1 GB"   # tiny; HBF-only run routes almost nothing to HBM
hbf_base_addr           = "0x1800000000"
hbf_size_bytes          = "512 GB" # CONFIRMED: SanDisk fact sheet

[hbf_controller]
read_queue_depth              = 128
write_queue_depth             = 64
scheduler_type                = "frfcfs"
controller_latency_cycles     = 10
enable_read_priority          = true
max_outstanding_per_subarray  = 4

[logic_die]
num_channels                  = 8
num_dies_per_stack            = 16
num_subarrays_per_die         = 32
tsv_bandwidth_gbps            = 200 # TODO: needs validation
logic_die_freq_mhz            = 1000
command_translation_cycles    = 2
max_concurrent_subarray_cmds  = 64

[nand_media]
page_size_bytes           = 16384
pages_per_block           = 512
blocks_per_subarray       = 1024
tR_cycles                 = 50_000   # ESTIMATED: 3D NAND ~50 us, TODO validate
tPROG_cycles              = 500_000
tBERS_cycles              = 3_000_000
cache_buffer_pages        = 4
cache_hit_read_cycles     = 500
num_dies_per_stack        = 16
num_subarrays_per_die     = 32
capacity_per_die_bytes    = "32 GB"   # CONFIRMED: SanDisk fact sheet

[hbm_media]
num_banks                 = 16
bandwidth_gbps            = 1024.0
tCL_cycles                = 14
tRCD_cycles               = 14
tRP_cycles                = 14
access_granularity        = 64
capacity_bytes            = "1 GB"
