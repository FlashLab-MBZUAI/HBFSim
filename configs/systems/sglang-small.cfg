# Small, explicit physical profile for native SGLang integration.
# Overlay on eight-stack-baseline.cfg. Functional/sensitivity geometry,
# not a calibrated commercial HBF/GPU configuration.
hbm-stacks=2
hbm-channels=4
hbm-capacity-bytes=67108864
hbf-stacks=2
hbf-channels=1
hbf-dies-per-channel=1
hbf-planes-per-die=2
hbf-blocks-per-plane=64
hbf-pages-per-block=8
hbf-page-size=4096
hbf-page-read-queue-depth-per-stack=64
hbf-gc-low-watermark-pages=8
hbf-gc-hard-watermark-pages=0
hbf-gc-reserved-free-blocks-per-plane=2
hbf-write-buffer-pages=8
hbf-write-buffer-flush-threshold-pages=4
