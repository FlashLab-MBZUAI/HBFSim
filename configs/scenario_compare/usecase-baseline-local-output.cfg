# Controlled local-output sensitivity derived from usecase-baseline.cfg.
# The only numeric changes are 16 -> 32 media lanes and page-buffer banks per
# plane, yielding one local raw-data output per modeled subarray. All shared
# downstream resources retain the vendor-anchored 1.6 TB/s-per-stack baseline.
# This is an exploratory topology, not a shipping-product declaration.
line-size=4096
interarrival-ns=1

# Direct compositions reserve the upper 1 GiB for cooperative HBF-bound writes;
# both address boundaries stop below that non-overlapping physical region.
flat-hbm-bytes=411243118592
# HBF-static-direct-read scenario: reads below this stay on HBM.
static-direct-hbm-bytes=411243118592

# Maximum 144 GiB per EC6 layer buffer. Runtime sizes both parity buffers from
# actual per-layer data; this is not a static 288 GiB reservation.
layer-buffer-bytes=154618822656
# Per-stack D2D bandwidth from the TCAD architecture model, not a Sandisk
# measurement. The source gives no extra fixed latency, so this adds none.
base-die-link-read-bw=2048
base-die-link-write-bw=512
base-die-link-latency-ns=0

# Cooperative write-staging policy: HBF-bound writes land in a 1 GiB HBM
# region and later destage to the FTL; region pressure forces honest drain.
hbf-hbm-write-buffer-bytes=1073741824

# ---- Normalized HBM4-width comparison profile: 48 GiB and 6.4 Gb/s/pin
# ---- over 2048 DQ = 1638.4 GB/s per stack. The 2048-bit/64-PC organization
# ---- and BL8 are source-anchored; rate, capacity, bank-group decomposition,
# ---- row size, and absolute core timings remain explicit assumptions.
hbm-stacks=8
hbm-capacity-bytes=412316860416
hbm-channels=32
hbm-pseudo-channels=2
hbm-bank-groups-per-pseudo-channel=16
hbm-banks-per-group=4
hbm-channel-row-size-bytes=2048
hbm-channel-width-bits=64
hbm-burst-length=8
hbm-pin-rate-gbps=6.4
hbm-data-rate-per-command-clock=4
hbm-tccd-s-cycles=2
hbm-tccd-l-cycles=4
# Absolute core/turnaround minima are exploratory and round up to CK edges.
hbm-address-mapping-ns=0
hbm-trcdrd-ns=14
hbm-trcdwr-ns=14
hbm-tcl-ns=14
hbm-tcwl-ns=10
hbm-trp-ns=14
hbm-tras-ns=32
hbm-trc-ns=46
hbm-twr-ns=15
hbm-trtp-ns=7.5
hbm-trrd-s-ns=4
hbm-trrd-l-ns=6
hbm-tfaw-ns=20
hbm-twtr-s-ns=4
hbm-twtr-l-ns=8
hbm-trtw-ns=8

# ---- HBF local-output sensitivity: geometry remains 512 GiB and the shared
# ---- downstream read interface remains 1600 GB/s per stack. The 32 modeled
# ---- subarrays now have 32 media lanes and 32 page-buffer banks per plane.
hbf-stacks=8
hbf-channels=4
hbf-dies-per-channel=4
hbf-planes-per-die=4
hbf-blocks-per-plane=8192
hbf-pages-per-block=256
hbf-page-size=4096
hbf-oob-bytes=224
hbf-media-lanes-per-plane=32
hbf-subarrays-per-plane=32
hbf-page-buffer-banks-per-plane=32
hbf-read-ns=1000
hbf-program-ns=95000
hbf-program-verify-ns=5000
hbf-erase-ns=2000000
hbf-ecc-decode-latency-ns=250
hbf-ecc-encode-latency-ns=250
# Shared channel/TSV/ECC/HBIO rates intentionally match the baseline: this
# isolates local-output multiplicity instead of silently widening the fabric.
hbf-ecc-decode-raw-bw=105.46875
hbf-ecc-encode-raw-bw=105.46875
hbf-channel-bw=421.875
hbf-hbio-bw=1600
hbf-tsv-bw=1712.5
hbf-media-lane-bw=2048
hbf-page-buffer-bw=2048
# Controller DRAM defaults to the exact full-resident L2P footprint. Lookups
# use a pipelined 1 ns issue slot with a 100 ns response.

hbf-gc-low-watermark-pages=4096
hbf-gc-hard-watermark-pages=0
hbf-gc-reserved-free-blocks-per-plane=2
hbf-gc-wear-leveling-weight=0.05

hbf-write-coalescing=true
hbf-write-buffer-completion-requires-flush=false
hbf-write-buffer-pages=1024
hbf-write-buffer-flush-threshold-pages=512
