# 4 normalized HBM4-width + 4 HBF stacks (192 + 2048 GiB): balanced composition point.
# Exploratory simulator profile; see configs/parameter-provenance.json.
line-size=4096
interarrival-ns=1

# Leave the upper 1 GiB for the cooperative write region.
flat-hbm-bytes=205084688384
# HBF-static-direct-read scenario: reads below this stay on HBM.
static-direct-hbm-bytes=205084688384

# Maximum 72 GiB per EC6 layer buffer; runtime sizing may allocate less.
layer-buffer-bytes=77309411328
# Per-stack HBM<->HBF D2D bandwidth from the TCAD architecture model, not a
# Sandisk measurement. Sandisk publishes 1.6 TB/s HBF-stack read bandwidth but
# no separate D2D read/write bandwidth. The TCAD source does not specify an
# additional fixed link latency, so this profile adds none.
base-die-link-read-bw=2048
base-die-link-write-bw=512
base-die-link-latency-ns=0

# Cooperative write-staging policy: HBF-bound writes land in a 1 GiB HBM
# region and later destage to the FTL; region pressure forces honest drain.
hbf-hbm-write-buffer-bytes=1073741824

# ---- Normalized HBM4-width profile: 6.4 Gb/s/pin over 2048 DQ gives
# ---- 1638.4 GB/s per stack. See parameter-provenance.json.
hbm-stacks=4
hbm-capacity-bytes=206158430208
hbm-channels=32
hbm-pseudo-channels=2
hbm-bank-groups-per-pseudo-channel=16
hbm-banks-per-group=4
hbm-channel-row-size-bytes=2048
hbm-channel-width-bits=64
hbm-burst-length=8
hbm-pin-rate-gbps=6.4
hbm-data-rate-per-command-clock=4
hbm-tccd-s-cycles=2
hbm-tccd-l-cycles=4
# Absolute core/turnaround minima are exploratory and round up to CK edges.
hbm-address-mapping-ns=0
hbm-trcdrd-ns=14
hbm-trcdwr-ns=14
hbm-tcl-ns=14
hbm-tcwl-ns=10
hbm-trp-ns=14
hbm-tras-ns=32
hbm-trc-ns=46
hbm-twr-ns=15
hbm-trtp-ns=7.5
hbm-trrd-s-ns=4
hbm-trrd-l-ns=6
hbm-tfaw-ns=20
hbm-twtr-s-ns=4
hbm-twtr-l-ns=8
hbm-trtw-ns=8

# ---- HBF profile: the geometry computes 512 GiB and read interface is
# ---- 1600 GB/s per stack. Sandisk publishes 512 GB decimal, 16 dies and
# ---- 1.6 TB/s; internal topology and the GiB geometry are assumptions.
hbf-stacks=4
hbf-channels=4
hbf-dies-per-channel=4
hbf-planes-per-die=4
hbf-blocks-per-plane=8192
hbf-pages-per-block=256
hbf-page-size=4096
hbf-oob-bytes=224
hbf-media-lanes-per-plane=16
hbf-subarrays-per-plane=32
hbf-page-buffer-banks-per-plane=16
hbf-read-ns=1000
hbf-program-ns=95000
hbf-program-verify-ns=5000
hbf-erase-ns=2000000
hbf-ecc-decode-latency-ns=250
hbf-ecc-encode-latency-ns=250
# 1600 GB/s HBIO is decoded payload. ECC/channel carry the 4320 B page+OOB
# codeword; the shared TSV also carries one 64 B command per page.
hbf-ecc-decode-raw-bw=105.46875
hbf-ecc-encode-raw-bw=105.46875
hbf-channel-bw=421.875
hbf-hbio-bw=1600
hbf-tsv-bw=1712.5
hbf-media-lane-bw=2048
hbf-page-buffer-bw=2048
# Controller DRAM defaults to the exact full-resident L2P footprint. Lookups
# use a pipelined 1 ns issue slot with a 100 ns response.

hbf-gc-low-watermark-pages=4096
hbf-gc-hard-watermark-pages=0
hbf-gc-reserved-free-blocks-per-plane=2
hbf-gc-wear-leveling-weight=0.05

hbf-write-coalescing=true
hbf-write-buffer-completion-requires-flush=false
hbf-write-buffer-pages=1024
hbf-write-buffer-flush-threshold-pages=512
