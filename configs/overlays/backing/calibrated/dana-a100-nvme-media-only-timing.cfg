# DANA A100 compute-local XFS/LVM/md/Intel-NVMe media-only timing view.
# This is the `nvme_media_only` profile produced by
# evidence/hardware/dana_a100_offload/calibrate.py from the same fit jobs as
# dana-a100-nvme-ssd-timing.cfg.  Use it only when GPU<->pinned-host DMA is a
# separate logical stage.  Controller and host-link costs are neutralized so
# those costs cannot be charged twice.  Capacity still comes from the complete
# backing profile applied before this overlay.
external-backing-kind=nvme-ssd
external-backing-page-size=4096
external-backing-request-segment-bytes=131072
external-backing-media-channels=1
external-backing-media-read-queues=1
external-backing-media-write-queues=1
external-backing-max-outstanding-requests=512
external-backing-controller-issue-ns=0.0
external-backing-controller-processing-ns=0.0
external-backing-media-read-latency-ns=9673.874459157763
external-backing-media-write-latency-ns=10523.54686189563
external-backing-media-read-bw=2.847090205168068
external-backing-media-write-bw=2.553624737252157
external-backing-m2s-bw=1000000.0
external-backing-s2m-bw=1000000.0
external-backing-one-way-propagation-ns=0.0
external-backing-command-bytes=64
external-backing-completion-bytes=16
