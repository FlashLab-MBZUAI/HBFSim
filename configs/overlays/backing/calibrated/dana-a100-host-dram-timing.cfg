# DANA A100 CUDA-pinned host-DRAM timing calibration. Apply after the complete
# host-dram profile; this overlay intentionally does not change usable capacity.
# Source: evidence/hardware/dana_a100_offload/calibration/
# dana-a100-offload-calibration.json (jobs 188541, 188542, 188543 on gpu-51).
# Jobs 188541/188542 fit; job 188543 is the independent 16 MiB holdout.
# Claim scope: this DANA pinned-host 16 MiB path only.
external-backing-kind=host-dram
external-backing-page-size=4096
external-backing-request-segment-bytes=16777216
external-backing-media-channels=1
external-backing-media-read-queues=1
external-backing-media-write-queues=1
external-backing-max-outstanding-requests=512
external-backing-controller-issue-ns=5100.435455322266
external-backing-controller-processing-ns=28375.26073026073
external-backing-media-read-latency-ns=0.0
external-backing-media-write-latency-ns=0.0
# Host transfer is modeled exactly once by the directional link; these media
# values are numerical non-bottleneck sentinels, not measured DRAM bandwidth.
external-backing-media-read-bw=1000000.0
external-backing-media-write-bw=1000000.0
external-backing-m2s-bw=25.596644558615655
external-backing-s2m-bw=23.07758806058801
external-backing-one-way-propagation-ns=0.0
external-backing-command-bytes=64
external-backing-completion-bytes=16
