# DANA A100 compute-local XFS/LVM/md/Intel-NVMe timing calibration. Apply after
# the complete nvme-ssd profile; this overlay intentionally does not change
# usable capacity. Source: evidence/hardware/dana_a100_offload/calibration/
# dana-a100-offload-calibration.json (jobs 188541, 188542, 188543 on gpu-51).
# Jobs 188541/188542 fit; job 188543 is the independent 16 MiB QD1/QD8 holdout.
# Fit-run QD8/QD1 scaling selects one effective read queue and one effective
# write queue; these are caller-range service widths, not literal NVMe queues.
external-backing-kind=nvme-ssd
external-backing-page-size=4096
external-backing-request-segment-bytes=131072
external-backing-media-channels=1
external-backing-media-read-queues=1
external-backing-media-write-queues=1
external-backing-max-outstanding-requests=512
external-backing-controller-issue-ns=5100.435455322266
external-backing-controller-processing-ns=28375.26073026073
external-backing-media-read-latency-ns=9673.874459157763
external-backing-media-write-latency-ns=10523.54686189563
external-backing-media-read-bw=2.847090205168068
external-backing-media-write-bw=2.553624737252157
external-backing-m2s-bw=25.596644558615655
external-backing-s2m-bw=23.07758806058801
external-backing-one-way-propagation-ns=0.0
external-backing-command-bytes=64
external-backing-completion-bytes=16
