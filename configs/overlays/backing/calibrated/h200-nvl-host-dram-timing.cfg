# GPU <-> pinned host DRAM timing: NVIDIA H200 NVL, PCIe Gen5 x16, AMD EPYC 9654 host, pinned memory.
# Apply after the complete host-dram profile; usable capacity is unchanged.
# Fit of 3 evidence/hardware/host_link runs (median per direction and
# block) with the DANA A100 offload method: small-copy issue interval, per-direction
# link bandwidth slope, median fixed-latency residual. Media fields are
# non-bottleneck sentinels: the directional link models the host transfer once.
external-backing-kind=host-dram
external-backing-page-size=4096
external-backing-request-segment-bytes=16777216
external-backing-media-channels=1
external-backing-media-read-queues=1
external-backing-media-write-queues=1
external-backing-max-outstanding-requests=512
external-backing-controller-issue-ns=2994.991973876953
external-backing-controller-processing-ns=9338.574646448687
external-backing-media-read-latency-ns=0.0
external-backing-media-write-latency-ns=0.0
external-backing-media-read-bw=1000000.0
external-backing-media-write-bw=1000000.0
external-backing-m2s-bw=56.37374025627985
external-backing-s2m-bw=53.79252799475454
external-backing-one-way-propagation-ns=0.0
external-backing-command-bytes=64
external-backing-completion-bytes=16
