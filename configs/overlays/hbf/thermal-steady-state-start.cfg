# Sustained-serving initial-state boundary: the measured window is
# an excerpt of sustained serving, not a cold start. A serving-rate HBF
# stack dissipates far more than its ~14 W sustainable envelope, so its
# thermal steady state is pinned at the governor ceiling. This overlay
# boots every HBF stack at the throttle ceiling with the governor already
# engaged; pacing then holds dissipated power at the sustainable budget for
# as long as the load persists. Without it the sub-second window would
# under-heat a tau ~ 7.5 s RC node from idle and report a cold transient
# that no steady-state deployment would see. The start state is an
# experiment boundary, not a device property: system profiles boot idle,
# and a thermal cold start is the default initial state.
hbf-thermal-start-state=throttle-ceiling
