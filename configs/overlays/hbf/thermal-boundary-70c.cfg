# Boundary-temperature sweep point: 70 C local package boundary
# (45 C coolant-supply reference + 25 C declared neighbor cross-heating),
# a full-load GPU package neighborhood assumption. Sustains ~83 GB/s per
# stack in the reference parameterization. Boundaries at or above 75 C
# fail closed BY POLICY (the governor could never release, so permanent
# throttling must be an explicit decision), not as a physical operating
# limit: 75-80 C boundaries retain a positive pacing budget. Apply after
# a complete topology profile.
hbf-thermal-neighbor-heat-c=25
