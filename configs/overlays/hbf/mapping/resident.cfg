# HBF mapping strategy: page-level L2P fully resident in host HBM.
# Every lookup hits the table; there are no translation-page misses. The table
# needs 8 B per 4 KiB page (raw capacity / 512, 1 GiB per 512 GiB stack), so
# the comparison drops the cache budget for this strategy and reserves
# the complete table in HBM (the unlimited mapping case), which leaves less
# HBM for weights and KV.
hbf-mapping-organization=page
hbf-mapping-mode=full-resident
