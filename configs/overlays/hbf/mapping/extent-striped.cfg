# HBF mapping strategy: authoritative extent index over superblocks striped
# across every plane of the HBF stacks ("all" resolves to the composition's
# plane count). An ordered in-memory index of runs (48 B each) replaces the
# page table; writes append to one open segment, adjacent runs merge, and
# cleaning reclaims the least-valid segment. Consecutive appended pages program
# and read in parallel like the page FTL's page striping; the unit of allocation
# and cleaning grows accordingly. The index lives in HBM under the same mapping
# budget as the page FTL and must fit it (with no budget it would reserve its
# worst-case size, 48 B per raw page); common block state is reserved outside
# it, as for every organization, so the budget holds the index and the cleaning
# workspace. The write buffer is in HBF device DRAM.
hbf-mapping-organization=extent
hbf-mapping-superblock-planes=all
