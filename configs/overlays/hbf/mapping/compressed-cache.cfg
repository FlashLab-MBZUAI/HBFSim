# HBF mapping strategy: compressed translation-page cache over the page-level L2P.
# Clean translation pages are held as affine runs (24 B each) and fall back to
# dense pages when irregular; updates expand them in memory. Same HBM mapping budget;
# the persistent L2P stays page-level. Lossless, not a learned index (LeaFTL).
hbf-mapping-organization=page
hbf-mapping-mode=cached
hbf-mapping-cache-layout=extent
# Cache tags and two bounded translation scratch pages per stack, as in the
# tests/fixtures/mapping-organizations presets; both count against the HBM mapping budget.
hbf-mapping-cache-tag-bytes=16
hbf-mapping-scratch-pages=2
