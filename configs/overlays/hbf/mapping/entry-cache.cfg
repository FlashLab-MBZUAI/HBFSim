# HBF mapping strategy: DFTL-style entry cache over the page-level L2P.
# Caches individual entries (8 B PPN plus tag) within the HBM mapping
# budget; a miss reads the backing translation page, and dirty entries are
# merged back per translation page. Mechanism after DFTL (ASPLOS 2009), not a
# complete reproduction of it.
hbf-mapping-organization=page
hbf-mapping-mode=cached
hbf-mapping-cache-layout=entry
# Cache tags and two bounded translation scratch pages per stack, as in the
# tests/fixtures/mapping-organizations presets; both count against the HBM mapping budget.
hbf-mapping-cache-tag-bytes=16
hbf-mapping-scratch-pages=2
