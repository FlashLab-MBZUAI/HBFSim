# Reduced-capacity GC and wear mechanism window. Apply after a complete physical
# system profile. Stack/plane topology and page/block geometry are explicit;
# the 4 MiB raw capacity is not a production HBF capacity claim.
hbf-stacks=2
hbf-channels=1
hbf-dies-per-channel=1
hbf-planes-per-die=2
hbf-blocks-per-plane=32
hbf-pages-per-block=8
hbf-page-size=4096

# Serialize visible writes through media so invalidation and GC causality are
# identical across address-order and checkpoint-cadence cells.
hbf-write-coalescing=true
hbf-write-buffer-completion-requires-flush=true
hbf-write-buffer-pages=16
hbf-write-buffer-flush-threshold-pages=8
hbf-page-read-queue-depth-per-stack=64

# Preserve a real reserve on every plane and force maintenance within the
# deterministic 720-page, four-round mechanism window.
hbf-gc-low-watermark-pages=8
hbf-gc-hard-watermark-pages=0
hbf-gc-reserved-free-blocks-per-plane=2
