# Reference-runner policy defaults paired with systems/6hbm-2hbf.cfg.
line-size=4096
interarrival-ns=1
# The flat / direct-read boundary is the base of the cooperative HBM write
# region, not HBM capacity minus the buffer: application HBM = hbm-capacity-bytes
# minus the controller-DRAM reservation for the host FTL (hbf-ctrl-dram-bytes,
# burst-aligned); minus hbf-hbm-write-buffer-bytes; rounded down to an HBF page.
# The reference runner reports the value as cooperative_write_region_base.
flat-hbm-bytes=306008023040
static-direct-hbm-bytes=306008023040
layer-buffer-bytes=115964116992
hbf-hbm-write-buffer-bytes=1073741824
