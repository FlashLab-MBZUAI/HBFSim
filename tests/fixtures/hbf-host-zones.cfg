# Small OCP section 11.4 lifecycle example, not a calibrated product geometry.
hbf-stacks=2
hbf-channels=2
hbf-dies-per-channel=1
hbf-planes-per-die=1
hbf-blocks-per-plane=32
hbf-pages-per-block=8
hbf-page-size=4096
hbf-zone-size-blocks=4
hbf-host-zone-wear-gap=1
hbf-host-zone-remap-ns=100
hbf-host-gc-decision-ns=50
hbf-write-coalescing=false
hbf-thermal-enable=false
hbf-gc-low-watermark-pages=8
hbf-gc-hard-watermark-pages=0
hbf-gc-reserved-free-blocks-per-plane=2
