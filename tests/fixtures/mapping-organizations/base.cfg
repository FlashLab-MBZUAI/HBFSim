# Test fixture: a 32 MiB single-plane HBF for exercising every mapping
# organization. Load after configs/systems/eight-stack-baseline.cfg, then one
# of the sibling organization files; NAND timing comes from that baseline.
hbf-stacks=1
hbf-channels=1
hbf-dies-per-channel=1
hbf-planes-per-die=1
hbf-blocks-per-plane=256
hbf-pages-per-block=32
hbf-page-size=4096
hbf-logical-capacity-bytes=25165824
hbf-mapping-mode=full-resident
hbf-mapping-cache-layout=page
hbf-mapping-scratch-pages=2
hbf-mapping-cache-tag-bytes=16
hbf-mapping-log-blocks=8
hbf-ctrl-dram-bytes=0
hbf-write-coalescing=false
hbf-write-buffer-pages=0
hbf-write-buffer-flush-threshold-pages=0
hbf-gc-low-watermark-pages=64
hbf-gc-hard-watermark-pages=0
hbf-gc-reserved-free-blocks-per-plane=2
hbf-thermal-enable=false
