          - [1, [4, 6], [3, 5], 2, 1, true]
          - [1, [3], [2], 12]
          - [1, [4], [2], 44]
          - [1, [0], [0], 4]
          - [1, [0], [0], 34, 4]
          - [1, [0], [2], 52]
