          - [1, [0], [7], 72]
          - [1, [1, 2], [7], 20]
          - [1, [5], [7], 32]
          - [1, [6], [7], 64]
          - [1, [7], [0, 2], 576]
          - [2, [3, 5], [3, 5], 8]
          - [2, [4, 6], [4, 6], 8]
          - [2, [4, 6], [3, 5], 32]
          - [2, [0], [0], 8]
